<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, new times roman;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }


        .container {

            width: 100%;

            max-width: 600px;

            background: light blue;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.25);
        }


        .header {

            text-align: center;

            margin-bottom: 25px;
        }


        .header h1 {

            color: #333;

            margin-bottom: 8px;

            font-size: 32px;
        }


        .header p {

            color: #777;
        }


        .input-area {

            display: flex;

            gap: 10px;

            margin-bottom: 25px;
        }


        #taskInput {

            flex: 1;

            padding: 14px;

            border: 2px solid #ddd;

            border-radius: 10px;

            font-size: 16px;

            outline: none;
        }


        #taskInput:focus {

            border-color: #667eea;
        }


        #addButton {

            padding: 14px 20px;

            border: none;

            border-radius: 10px;

            background: #667eea;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }


        #addButton:hover {

            background: #4f5fd1;
        }


        #taskList {

            list-style: none;
        }


        .task {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 15px;

            margin-bottom: 10px;

            background: #f5f6ff;

            border-radius: 10px;

            transition: 0.3s;
        }


        .task:hover {

            transform: translateX(3px);
        }


        .task-left {

            display: flex;

            align-items: center;

            gap: 12px;

            flex: 1;
        }


        .task-left input {

            width: 18px;

            height: 18px;

            cursor: pointer;
        }


        .task-text {

            font-size: 16px;

            color: #333;

            word-break: break-word;
        }


        .completed {

            text-decoration: line-through;

            color: #999;
        }


        .delete-button {

            border: none;

            background: #ff5c5c;

            color: white;

            padding: 8px 12px;

            border-radius: 7px;

            cursor: pointer;
        }


        .delete-button:hover {

            background: #e04444;
        }


        .bottom {

            margin-top: 25px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;
        }


        #taskCount {

            color: #666;

            font-size: 14px;
        }


        #clearButton {

            border: none;

            background: #555;

            color: white;

            padding: 10px 15px;

            border-radius: 8px;

            cursor: pointer;
        }


        #clearButton:hover {

            background: #333;
        }


        .empty {

            text-align: center;

            color: #999;

            padding: 25px;
        }


        footer {

            text-align: center;

            margin-top: 25px;

            color: #999;

            font-size: 13px;
        }


        @media (max-width: 500px) {

            .input-area {

                flex-direction: column;
            }


            #addButton {

                width: 100%;
            }


            .bottom {

                flex-direction: column;
            }


            .header h1 {

                font-size: 27px;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <div class="header">

        <h1>📝 My To-Do List</h1>

        <p>
            Organize your tasks and stay productive.
        </p>

    </div>


    <div class="input-area">

        <input
            type="text"
            id="taskInput"
            placeholder="Enter a new task..."
        >

        <button id="addButton">
            Add Task
        </button>

    </div>


    <ul id="taskList"></ul>


    <div class="bottom">

        <span id="taskCount">
            0 tasks remaining
        </span>

        <button id="clearButton">
            Clear Completed
        </button>

    </div>


    <footer>

        To-Do List App | HTML, CSS & JavaScript

    </footer>


</div>


<script>

    const taskInput =
        document.getElementById("taskInput");

    const addButton =
        document.getElementById("addButton");

    const taskList =
        document.getElementById("taskList");

    const taskCount =
        document.getElementById("taskCount");

    const clearButton =
        document.getElementById("clearButton");


    let tasks =
        JSON.parse(localStorage.getItem("tasks")) || [];


    function saveTasks() {

        localStorage.setItem(
            "tasks",
            JSON.stringify(tasks)
        );
    }


    function displayTasks() {

        taskList.innerHTML = "";


        if (tasks.length === 0) {

            taskList.innerHTML =
                '<li class="empty">No tasks yet. Add one above! 🎯</li>';

        }


        tasks.forEach(function(task, index) {


            const listItem =
                document.createElement("li");

            listItem.className = "task";


            const leftSide =
                document.createElement("div");

            leftSide.className = "task-left";


            const checkbox =
                document.createElement("input");

            checkbox.type = "checkbox";

            checkbox.checked = task.completed;


            checkbox.addEventListener(
                "change",
                function() {

                    tasks[index].completed =
                        checkbox.checked;

                    saveTasks();

                    displayTasks();

                }
            );


            const taskText =
                document.createElement("span");

            taskText.textContent =
                task.text;

            taskText.className = "task-text";


            if (task.completed) {

                taskText.classList.add(
                    "completed"
                );

            }


            leftSide.appendChild(checkbox);

            leftSide.appendChild(taskText);


            const deleteButton =
                document.createElement("button");

            deleteButton.textContent =
                "Delete";

            deleteButton.className =
                "delete-button";


            deleteButton.addEventListener(
                "click",
                function() {

                    tasks.splice(index, 1);

                    saveTasks();

                    displayTasks();

                }
            );


            listItem.appendChild(leftSide);

            listItem.appendChild(deleteButton);


            taskList.appendChild(listItem);

        });


        updateTaskCount();

    }


    function addTask() {

        const text =
            taskInput.value.trim();


        if (text === "") {

            alert("Please enter a task.");

            return;

        }


        tasks.push({

            text: text,

            completed: false

        });


        taskInput.value = "";


        saveTasks();

        displayTasks();

    }


    function updateTaskCount() {

        const remaining =
            tasks.filter(
                task => !task.completed
            ).length;


        if (remaining === 1) {

            taskCount.textContent =
                "1 task remaining";

        }

        else {

            taskCount.textContent =
                remaining +
                " tasks remaining";

        }

    }


    clearButton.addEventListener(
        "click",
        function() {

            tasks =
                tasks.filter(
                    task => !task.completed
                );


            saveTasks();

            displayTasks();

        }
    );


    addButton.addEventListener(
        "click",
        addTask
    );


    taskInput.addEventListener(
        "keypress",
        function(event) {

            if (event.key === "Enter") {

                addTask();

            }

        }
    );


    displayTasks();

</script>


</body>

</html>
